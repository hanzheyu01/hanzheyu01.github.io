<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hanzheyu01 的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
        }
        h1 {
            font-size: 42px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 32px;
        }
        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .link-btn {
            padding: 12px 28px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .link-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 48px;
            font-size: 13px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">👋</div>
        <h1>你好,我是 hanzheyu01</h1>
        <p class="subtitle">欢迎来到我的 GitHub Pages 个人主页</p>
        <div class="links">
            <a href="https://github.com/hanzheyu01" class="link-btn" target="_blank">GitHub</a>
            <a href="https://github.com/hanzheyu01/ai-agent" class="link-btn" target="_blank">我的项目</a>
        </div>
        <div class="footer">
            <p>© 2026 hanzheyu01 · Powered by GitHub Pages</p>
        </div>
    </div>
</body>
</html>
